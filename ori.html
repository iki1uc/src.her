<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · Axiom‑Orbit‑System · v3</title>

<style>
    body { background:#0b0b0b; color:#e0e0e0; font-family:Consolas; padding:20px; }
    h1 { color:#6cf; }
    .container { max-width:900px; margin:0 auto; }
    .flex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:6px 0; }
    #orbitCanvas { background:#000; border:1px solid #333; display:block; margin:6px 0; }
    #log { background:#111; padding:10px; height:120px; overflow:auto; font-size:13px; margin-top:6px; }
    .btn { padding:6px 14px; background:#222; color:#fff; border:1px solid #555; cursor:pointer; font-family:Consolas; }
    .btn:hover { border-color:#6cf; }
    .btn.active { border-color:#6cf; background:#2a3a4a; }
    .btn.danger { border-color:#f44; color:#f44; }
    .btn.danger:hover { background:#2a0a0a; }
    .label { color:#8ab0c0; font-size:12px; }
    input[type="range"] { width:120px; background:#222; accent-color:#6cf; }
    .status { font-size:12px; color:#5a7a8a; }
    .status .ok { color:#8cf0d0; }
    .status .err { color:#ff6b6b; }
    .badge { display:inline-block; padding:1px 10px; border-radius:12px; font-size:11px; border:1px solid #2a3a4a; }
    .badge.aktiv { border-color:#8cf0d0; color:#8cf0d0; }
    .badge.pause { border-color:#f0d080; color:#f0d080; }
    .badge.leader { border-color:#ffd700; color:#ffd700; }
    .badge.follower { border-color:#888; color:#888; }
</style>
</head>
<body>

<div class="container">

<h1>IKI1UC · Axiom‑Orbit‑System <span style="color:#5a7a8a;font-size:14px;font-weight:300;">v3 — stabil · synchron · drift‑frei</span></h1>

<!-- STATUS -->
<div class="flex" style="justify-content:space-between;">
  <span class="status">🔷 Modul‑Status: <span id="moduleStatus" class="ok">● geladen</span></span>
  <span class="status">🌀 Orbit: <span id="orbitStatus" class="badge aktiv">AKTIV</span></span>
  <span class="status">📡 Sync: <span id="syncStatus" class="ok">● verbunden</span></span>
  <span class="status">👑 Rolle: <span id="roleStatus" class="badge leader">LEADER</span></span>
</div>

<!-- CANVAS -->
<canvas id="orbitCanvas" width="700" height="300"></canvas>

<!-- STEUERUNG -->
<div class="flex">
  <button class="btn" id="btnPlay">⏸ Pause</button>
  <button class="btn" id="btnStep">▶ Schritt</button>
  <button class="btn" id="btnReset">⟲ Reset</button>
  <span class="label">Geschw.</span>
  <input type="range" id="speedSlider" min="1" max="10" value="3">
  <span class="label" id="speedLabel">3×</span>
  <button class="btn" id="btnModeIQQ">IQQ</button>
  <button class="btn" id="btnModeOCTA">OCTA</button>
  <button class="btn" id="btnModeA81">A81</button>
</div>

<!-- AXIOM‑ANZEIGE -->
<div class="flex" style="font-size:13px;color:#8ab0c0;gap:16px;">
  <span>🌀 IQQ: <span id="axiomIQQ" style="color:#ffd700;">9 → 3 → 9 → 3</span></span>
  <span>◎ OCTA: <span id="axiomOCTA" style="color:#6cf;">◉ ◆ △ ▣ ↺</span></span>
  <span>📐 A81: <span id="axiomA81" style="color:#b388ff;">27 · 81 · 243 · 729</span></span>
</div>

<!-- LOG -->
<div id="log">System geladen · Orbit v3</div>

</div>

<script>
"use strict";
/* ================================================================
   IKI1UC · Axiom‑Orbit‑System v3
   Fixes basierend auf RUN‑21‑Kritik (v2 → v3):

   ✔ Leader‑Election über localStorage (nur EIN Tab treibt die Engine)
     → behebt: History‑Desync, Axiom‑Doppel‑Feuer, Sync‑Chaos
   ✔ requestAnimationFrame + Zeit‑Akkumulator statt setInterval
     → behebt: Timer‑Drift, Slider‑Ruckeln beim Ziehen
   ✔ Log scrollt nur automatisch, wenn Nutzer schon unten ist
     → behebt: Scroll‑Jump
   ✔ Persistenter BroadcastChannel statt Neuerstellung pro Schritt
     → behebt: unnötigen Overhead / Delay
   ✔ Feste Basis (5) für Pfad‑Spacing statt variabler history.length
     → behebt: überlagernde Pfad‑Symbole
   ================================================================ */

  // ─── MODUL‑VALIDIERUNG ─────────────────────────────────────────
  const requiredModules = [
    'core.js', 'SYS.js', 'axiom.js', 'atom.js', 'molecule.js',
    'rawator.js', 'rawator-81.js', 'rawator-life.js',
    'RAWATOR.geo.json', 'RAWATOR.id.json',
    'RESPO.room.js', 'NC.room.js', 'HOLO.room.js',
    'HOLO.engine.js', 'beam.js', 'beam.json',
    'user.json', 'use.json'
  ];
  const loaded = requiredModules.slice(); // simulierte Prüfung, wie in v2
  const failed = [];

  const modStatus = document.getElementById('moduleStatus');
  if (failed.length === 0) {
    modStatus.textContent = '● ' + loaded.length + ' Module geladen';
    modStatus.className = 'ok';
  } else {
    modStatus.textContent = '⚠️ ' + failed.length + ' Module fehlen: ' + failed.join(', ');
    modStatus.className = 'err';
  }

  // ─── ORBIT‑DATEN ────────────────────────────────────────────────
  const ORBIT = [
    "◉","↗","↘","3","9","↘","↗","◎","↗","↘","3","9","↘","↗",
    "◎","↗","↘","81","◆","↘","↗","△","↗","↘","27","▣","↘","↗","3","↺"
  ];

  const AXIOM_MAP = {
    '3': 'IQQ', '9': 'IQQ',
    '◎': 'OCTA', '◉': 'OCTA', '◆': 'OCTA', '△': 'OCTA', '▣': 'OCTA', '↺': 'OCTA',
    '81': 'A81', '27': 'A81', '243': 'A81', '729': 'A81'
  };

  const PATH_BASE = 5; // feste Basis für Pfad‑Spacing (fix #5)

  const state = {
    index: 0,
    running: true,
    speed: 3,
    mode: 'IQQ',
    history: [],
    axiomCount: { IQQ: 0, OCTA: 0, A81: 0 },
    isLeader: false,
    accumulator: 0,
    lastFrame: null
  };

  // ─── LEADER‑ELECTION (fix #1) ──────────────────────────────────
  const LEADER_KEY = 'iki1uc-orbit-leader';
  const LEADER_TIMEOUT = 2000;   // ms, wie lange ein Herzschlag gültig ist
  const HEARTBEAT_EVERY = 500;   // ms

  function tryClaimLeadership() {
    const now = Date.now();
    const raw = localStorage.getItem(LEADER_KEY);
    const last = raw ? Number(raw) : 0;

    if (state.isLeader) {
      // Ich bin Leader → Herzschlag erneuern
      localStorage.setItem(LEADER_KEY, String(now));
      return;
    }

    if (now - last > LEADER_TIMEOUT) {
      // Alter Leader ist verschwunden (Timeout) → ich übernehme
      localStorage.setItem(LEADER_KEY, String(now));
      state.isLeader = true;
      updateRoleBadge();
      log('👑 Diesen Tab zum Leader gemacht (kein aktiver Leader gefunden)');
    }
  }

  function updateRoleBadge() {
    const el = document.getElementById('roleStatus');
    el.textContent = state.isLeader ? 'LEADER' : 'FOLLOWER';
    el.className = 'badge ' + (state.isLeader ? 'leader' : 'follower');
  }

  setInterval(tryClaimLeadership, HEARTBEAT_EVERY);
  tryClaimLeadership(); // sofortiger erster Versuch beim Laden

  // ─── PERSISTENTER BROADCASTCHANNEL (fix #4) ────────────────────
  let bc = null;
  try {
    bc = new BroadcastChannel('iki1uc-orbit');
    bc.onmessage = (e) => {
      const data = e.data;
      if (!data) return;

      if (data.type === 'orbit.step') {
        // Nur übernehmen, wenn ich NICHT Leader bin (fix #1: kein Gegeneinander)
        if (!state.isLeader) {
          state.index = data.index;
          state.history.push(data.index);
          if (state.history.length > 10) state.history.shift();
          document.getElementById('syncStatus').textContent = '● synchronisiert';
          document.getElementById('syncStatus').className = 'ok';
          log(`📡 Sync‑Schritt vom Leader: ${data.symbol}`);
        }
      }
      if (data.type === 'orbit.reset') {
        if (!state.isLeader) {
          state.index = 0;
          state.history = [];
          log('📡 Sync‑Reset vom Leader');
        }
      }
      if (data.type === 'orbit.mode') {
        if (!state.isLeader) {
          state.mode = data.mode;
          applyModeButtons(data.mode);
        }
      }
    };
    setTimeout(() => {
      document.getElementById('syncStatus').textContent = '● verbunden';
      document.getElementById('syncStatus').className = 'ok';
    }, 500);
  } catch (_) {
    document.getElementById('syncStatus').textContent = '○ kein BroadcastChannel';
    document.getElementById('syncStatus').className = 'err';
  }

  function broadcast(msg) {
    if (!bc) return;
    try { bc.postMessage(msg); } catch (_) {}
  }

  // ─── CANVAS ────────────────────────────────────────────────────
  const canvas = document.getElementById('orbitCanvas');
  const ctx = canvas.getContext('2d');

  function drawOrbit() {
    const w = canvas.width, h = canvas.height;
    ctx.shadowBlur = 0; // fix: sauber zurückgesetzt vor jedem Frame (Shadow-Flackern)
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // ─── Orbit‑Pfad (letzte 5 Schritte, feste Basis) ──────────
    const history = state.history.slice(-5);
    history.forEach((idx, i) => {
      const alpha = 0.1 + (i / PATH_BASE) * 0.3;
      const x = 80 + (w - 160) * (i / (PATH_BASE - 1)); // fix #5: feste Basis statt history.length
      const y = h - 30;
      ctx.fillStyle = `rgba(108, 204, 255, ${alpha})`;
      ctx.font = '16px Consolas';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(ORBIT[idx] || '?', x, y);
      if (i > 0) {
        ctx.strokeStyle = `rgba(108, 204, 255, ${alpha * 0.3})`;
        ctx.lineWidth = 1;
        const prevX = 80 + (w - 160) * ((i - 1) / (PATH_BASE - 1));
        ctx.beginPath();
        ctx.moveTo(prevX, y);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
    });

    // ─── Hauptsymbol ──────────────────────────────────────────
    const symbol = ORBIT[state.index] || '?';
    ctx.fillStyle = '#6cf';
    ctx.font = '60px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 20;
    ctx.fillText(symbol, w / 2, h / 2 - 20);
    ctx.shadowBlur = 0;

    // ─── Index + Axiom‑Info ──────────────────────────────────
    const axiom = AXIOM_MAP[symbol] || '—';
    ctx.fillStyle = '#5a7a8a';
    ctx.font = '14px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`#${state.index} · ${axiom}`, w / 2, h / 2 + 40);

    // ─── Geschwindigkeit + Modus ─────────────────────────────
    ctx.fillStyle = '#3a4a5a';
    ctx.font = '11px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`⏩ ${state.speed}× · ${state.mode}`, 12, h - 6);
    ctx.textAlign = 'right';
    ctx.fillText(`Symbol ${state.index + 1}/${ORBIT.length}`, w - 12, h - 6);
  }

  // ─── ORBIT‑STEP (nur der Leader ruft diesen auf) ───────────────
  function stepOrbit() {
    const next = (state.index + 1) % ORBIT.length;
    state.index = next;

    state.history.push(next);
    if (state.history.length > 10) state.history.shift();

    const sym = ORBIT[next];
    const axiom = AXIOM_MAP[sym] || null;
    if (axiom && state.mode === axiom) {
      state.axiomCount[axiom] = (state.axiomCount[axiom] || 0) + 1;
    }

    log(`Orbit‑Schritt → ${sym} (${axiom || '—'})`);
    broadcast({ type: 'orbit.step', index: state.index, symbol: sym });
  }

  // ─── PLAY/PAUSE ──────────────────────────────────────────────
  function togglePlay() {
    state.running = !state.running;
    document.getElementById('btnPlay').textContent = state.running ? '⏸ Pause' : '▶ Start';
    document.getElementById('orbitStatus').textContent = state.running ? 'AKTIV' : 'PAUSE';
    document.getElementById('orbitStatus').className = 'badge ' + (state.running ? 'aktiv' : 'pause');
  }

  // ─── RESET ────────────────────────────────────────────────────
  function resetOrbit() {
    state.index = 0;
    state.history = [];
    state.axiomCount = { IQQ: 0, OCTA: 0, A81: 0 };
    state.accumulator = 0;
    log('⟲ Orbit zurückgesetzt');
    broadcast({ type: 'orbit.reset' });
  }

  // ─── MODUS‑UMSCHALTUNG ──────────────────────────────────────
  function applyModeButtons(mode) {
    document.querySelectorAll('[id^="btnMode"]').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('btnMode' + mode);
    if (btn) btn.classList.add('active');
  }

  function setMode(mode) {
    state.mode = mode;
    applyModeButtons(mode);
    log(`🌀 Modus gewechselt: ${mode}`);
    broadcast({ type: 'orbit.mode', mode });
  }

  // ─── LOG (fix #3: kein erzwungener Scroll‑Jump) ────────────────
  function log(msg) {
    const logBox = document.getElementById('log');
    const atBottom = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 5;
    const time = new Date().toLocaleTimeString();
    const line = document.createElement('div');
    line.textContent = `[${time}] ${msg}`;
    logBox.appendChild(line);
    while (logBox.children.length > 80) logBox.removeChild(logBox.firstChild);
    if (atBottom) logBox.scrollTop = logBox.scrollHeight;
  }

  // ─── EVENTS ────────────────────────────────────────────────────
  document.getElementById('btnPlay').addEventListener('click', togglePlay);
  document.getElementById('btnStep').addEventListener('click', () => {
    if (state.isLeader) stepOrbit();
    else log('⏭ Manueller Schritt ignoriert (dieser Tab ist Follower)');
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    if (state.isLeader) resetOrbit();
    else log('⟲ Reset ignoriert (dieser Tab ist Follower)');
  });

  document.getElementById('btnModeIQQ').addEventListener('click', () => setMode('IQQ'));
  document.getElementById('btnModeOCTA').addEventListener('click', () => setMode('OCTA'));
  document.getElementById('btnModeA81').addEventListener('click', () => setMode('A81'));

  const speedSlider = document.getElementById('speedSlider');
  const speedLabel = document.getElementById('speedLabel');
  speedSlider.addEventListener('input', () => {
    // fix #2: nur den Wert setzen, KEIN Timer‑Neustart — der rAF‑Loop liest
    // state.speed bei jedem Frame neu, dadurch bleibt das Ziehen flüssig.
    state.speed = parseInt(speedSlider.value, 10);
    speedLabel.textContent = state.speed + '×';
  });

  // ─── TASTATUR ──────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight' && state.isLeader) stepOrbit();
    if (e.key === 'r' || e.key === 'R') { if (state.isLeader) resetOrbit(); }
    if (e.key === '1') setMode('IQQ');
    if (e.key === '2') setMode('OCTA');
    if (e.key === '3') setMode('A81');
  });

  // ─── HAUPT‑LOOP (fix #2: requestAnimationFrame + Akkumulator) ──
  function loop(now) {
    if (state.lastFrame === null) state.lastFrame = now;
    const delta = now - state.lastFrame;
    state.lastFrame = now;

    if (state.running && state.isLeader) {
      state.accumulator += delta;
      const stepTime = Math.max(100, 800 - state.speed * 60);
      // while-Schleife statt if: holt verpasste Schritte nach (z.B. nach Tab-Throttling)
      // statt sie einfach zu verlieren → kein "Drift" ‑ Effekt
      let guard = 0;
      while (state.accumulator >= stepTime && guard < 20) {
        stepOrbit();
        state.accumulator -= stepTime;
        guard++;
      }
    } else {
      state.accumulator = 0;
    }

    drawOrbit();
    requestAnimationFrame(loop);
  }

  // ─── INIT ──────────────────────────────────────────────────────
  function init() {
    log('🧠 Module geladen: ' + loaded.length);
    log('⚡ Axiom‑Orbit‑System v3 gestartet');

    setMode('IQQ');
    state.history.push(0);
    updateRoleBadge();

    requestAnimationFrame(loop);

    log('⌨️  Leertaste=Pause  →=Schritt  r=Reset  1=IQQ  2=OCTA  3=A81');
    log('👑 Leader‑Election aktiv: nur ein Tab treibt den Orbit, andere folgen synchron');
  }

  window.addEventListener('error', (e) => {
    log('⚠️ Fehler: ' + e.message);
  }, true);

  // Rollen‑Badge live aktualisieren, damit Tab-Wechsel sichtbar wird
  setInterval(updateRoleBadge, HEARTBEAT_EVERY);

  init();
</script>

</body>
</html>
